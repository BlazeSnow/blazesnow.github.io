services:
  vaultwarden:
    image: vaultwarden/server:alpine
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      SIGNUPS_ALLOWED: "false" # 不允许注册新用户
      ADMIN_TOKEN: "PASSWORD" # 此处填写管理员密码

  caddy:
    image: caddy:alpine
    container_name: caddy-vaultwarden
    restart: unless-stopped
    depends_on:
      - vaultwarden
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - 80:80
      - 443:443
