name: Build & Deploy
description: Build and Deploy Pages & Worker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 26

    - uses: pnpm/action-setup@v6
      with:
        version: 11

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build with VitePress
      run: pnpm run docs:build

    - uses: actions/upload-artifact@v7
      with:
        name: artifact
        path: .vitepress/dist

    - uses: actions/upload-artifact@v7
      with:
        name: wrangler
        path: wrangler.jsonc

  githubpages:
    runs-on: ubuntu-latest
    depends-on: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: artifact
        path: .vitepress/dist

    - uses: actions/configure-pages@v6

    - uses: actions/upload-pages-artifact@v5
      with:
        path: .vitepress/dist

    - uses: actions/deploy-pages@v5

  wrangler:
    runs-on: ubuntu-latest
    depends-on: build

    environment:
      name: wrangler
    permissions:
      pages: write
      id-token: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: artifact
        path: .vitepress/dist

    - uses: actions/download-artifact@v8
      with:
        name: wrangler
        path: wrangler.jsonc

    - uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
